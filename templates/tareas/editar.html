{% extends "base.html" %}
{% from "tareas/_macros.html" import formulario_tarea %}

{% block titulo %}Editar tarea{% endblock %}

{% block contenido %}
  <p><a href="{{ url_for('tareas.listado') }}">← Volver a tareas</a></p>

  <section class="panel">
    <h1>Editar tarea</h1>
    {{ formulario_tarea(form, url_for('tareas.editar', tarea_id=tarea.id), "Guardar cambios") }}
  </section>

  <form method="post" action="{{ url_for('tareas.borrar', tarea_id=tarea.id) }}" class="zona-borrar"
        onsubmit="return confirm('¿Seguro que quieres borrar esta tarea?');">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="boton boton-peligro" type="submit">🗑️ Borrar tarea</button>
  </form>
{% endblock %}
